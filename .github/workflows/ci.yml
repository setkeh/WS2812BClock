name: CI

on:
  push:
    branches: [main]
  pull_request:

# Currently only covers server/crashd. The firmware build needs the ESP-IDF
# toolchain, which this repository pins through the Nix flake -- adding a job
# that runs `nix develop --command idf.py build` is the natural next step.
jobs:
  crashd:
    name: crashd (vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/crashd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/crashd/go.mod
          cache: false          # no dependencies, so nothing to cache

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go test -race ./...
